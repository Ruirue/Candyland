<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Christmas Party Invite 🍬</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #FFF6E5, #E6DDF5);
    }

    .hero {
      background:
       linear-gradient(
  rgba(255,246,229,0.55),
  rgba(230,221,245,0.55)
),
        url("https://github.com/Ruirue/Candyland/blob/main/A%20whimsical%20Candylan.png?raw=true") center/80% no-repeat;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .ecard {
      background: linear-gradient(180deg, #FFFFFF, #FFF9F2);
      max-width: 420px;
      width: 100%;
      border-radius: 28px;
      padding: 34px 26px;
      text-align: center;
      box-shadow: 0 18px 35px rgba(0,0,0,0.12);
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #F4A7A0;
      font-size: 2.4em;
      margin-bottom: 12px;
    }

    p {
      color: #666;
      line-height: 1.6;
      font-size: 0.95em;
    }

    .details {
      background: #CFEDEA;
      border: 2px dashed #F6C1CC;
      padding: 18px;
      border-radius: 18px;
      margin: 22px 0;
      font-size: 0.9em;
      color: #555;
    }

    .details span {
      display: block;
      margin: 6px 0;
    }

    .btn {
      display: inline-block;
      margin-top: 22px;
      padding: 15px 34px;
      background: linear-gradient(135deg, #F6C1CC, #F4A7A0);
      color: #ffffff;
      text-decoration: none;
      border-radius: 45px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(246,193,204,0.6);
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(246,193,204,0.8);
    }

    footer {
      margin-top: 24px;
      font-size: 0.75em;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="ecard">

      <div class="emoji">☃️🍭🎁🍬🎄✨</div>

      <h1>Candyland Christmas </h1>

      <p>
        A cozy, candy-colored celebration awaits!  
        Come enjoy treats, laughter, and holiday cheer.
      </p>

      <div class="details">
        <span>📅 <strong>Date:</strong> December 22</span>
        <span>⏰ <strong>Time:</strong> 9:30 AM</span>
        <span>📍 <strong>Venue:</strong> Nursing Skills Lab</span>
      </div>

      <p>Please confirm your attendance below:</p>

      <a
        class="btn"
        href="https://docs.google.com/forms/d/e/1FAIpQLSdrknTe-2siXaR9Nmm4CIxB7Q3vD3UqwW0bipquDweftlO4lw/viewform"
        target="_blank">
        🍬 Let us know if you’re coming.
      </a>

      <footer>
        Let’s make it a pastel-sweet Christmas ✨
      </footer>

    </div>
  </div>

</body>
</html>
